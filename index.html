<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTER RIVALRY</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ====== ALL STYLES (Keep your existing styles) ====== */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#080808;color:#fff;min-height:100vh}
/* ... (keep all your styles from before) ... */
</style>
</head>
<body>

<!-- LOADING SCREEN - Will disappear in 2 seconds -->
<div id="loadingScreen" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#080808;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;">
    <div style="width:50px;height:50px;border:3px solid #222;border-top-color:#00d2ff;border-radius:50%;animation:spin 1s linear infinite;"></div>
    <div style="color:#888;margin-top:20px;">Loading INTER RIVALRY...</div>
    <div style="width:200px;height:4px;background:#222;border-radius:4px;margin-top:15px;overflow:hidden;">
        <div style="width:100%;height:100%;background:linear-gradient(90deg,#00d2ff,#fdcb6e);animation:progress 2s ease-in-out infinite;"></div>
    </div>
</div>

<style>
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes progress{0%{width:0%}50%{width:70%}100%{width:100%}}
</style>

<!-- ====== AUTH PAGE ====== -->
<section id="authPage" class="auth-page" style="display:flex;min-height:100vh;justify-content:center;align-items:center;padding:20px;">
<div style="width:100%;max-width:450px;background:#121212;border:1px solid #292929;border-radius:20px;padding:32px;box-shadow:0 20px 70px rgba(0,0,0,.5)">
<div style="text-align:center;font-size:30px;font-weight:900;letter-spacing:4px;">INTER RIVALRY</div>
<div style="text-align:center;color:#8c8c8c;margin:8px 0 30px;">Choose your battlefield.</div>
<div id="loginForm">
<h2>Login</h2>
<div style="margin-bottom:16px;"><label style="display:block;color:#aaa;font-size:14px;margin-bottom:7px;">Email</label><input id="loginEmail" type="email" placeholder="Enter your email" style="width:100%;padding:14px;background:#090909;border:1px solid #303030;border-radius:10px;color:#fff;outline:none;"></div>
<div style="margin-bottom:16px;"><label style="display:block;color:#aaa;font-size:14px;margin-bottom:7px;">Password</label><input id="loginPassword" type="password" placeholder="Enter your password" style="width:100%;padding:14px;background:#090909;border:1px solid #303030;border-radius:10px;color:#fff;outline:none;"></div>
<button onclick="login()" style="position:relative;padding:14px 32px;border:2px solid rgba(255,255,255,0.3);border-radius:12px;font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:1px;cursor:pointer;transition:all 0.08s;color:#1a1a1a;background:linear-gradient(180deg,#fff,#e0e0e0);box-shadow:0 8px 0 #b0b0b0,0 8px 25px rgba(255,255,255,0.15);transform:translateY(0);width:100%;">⚡ LOGIN</button>
<button onclick="showSignup()" style="position:relative;padding:14px 32px;border:2px solid rgba(255,255,255,0.3);border-radius:12px;font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:1px;cursor:pointer;transition:all 0.08s;color:#1a1a1a;background:linear-gradient(180deg,#fff,#e0e0e0);box-shadow:0 8px 0 #b0b0b0,0 8px 25px rgba(255,255,255,0.15);transform:translateY(0);width:100%;margin-top:10px;">✨ CREATE ACCOUNT</button>
<div id="authMessage" style="text-align:center;color:#aaa;font-size:14px;margin-top:16px;"></div>
</div>
<div id="signupForm" style="display:none;">
<h2>Create Account</h2>
<div style="margin-bottom:16px;"><label style="display:block;color:#aaa;font-size:14px;margin-bottom:7px;">Name</label><input id="signupName" type="text" placeholder="Full name" style="width:100%;padding:14px;background:#090909;border:1px solid #303030;border-radius:10px;color:#fff;outline:none;"></div>
<div style="margin-bottom:16px;"><label style="display:block;color:#aaa;font-size:14px;margin-bottom:7px;">Email</label><input id="signupEmail" type="email" placeholder="Email" style="width:100%;padding:14px;background:#090909;border:1px solid #303030;border-radius:10px;color:#fff;outline:none;"></div>
<div style="margin-bottom:16px;"><label style="display:block;color:#aaa;font-size:14px;margin-bottom:7px;">Password</label><input id="signupPassword" type="password" placeholder="Password" style="width:100%;padding:14px;background:#090909;border:1px solid #303030;border-radius:10px;color:#fff;outline:none;"></div>
<button onclick="signup()" style="position:relative;padding:14px 32px;border:2px solid rgba(255,255,255,0.3);border-radius:12px;font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:1px;cursor:pointer;transition:all 0.08s;color:#1a1a1a;background:linear-gradient(180deg,#fff,#e0e0e0);box-shadow:0 8px 0 #b0b0b0,0 8px 25px rgba(255,255,255,0.15);transform:translateY(0);width:100%;">✨ CREATE</button>
<button onclick="showLogin()" style="position:relative;padding:14px 32px;border:2px solid rgba(255,255,255,0.3);border-radius:12px;font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:1px;cursor:pointer;transition:all 0.08s;color:#1a1a1a;background:linear-gradient(180deg,#fff,#e0e0e0);box-shadow:0 8px 0 #b0b0b0,0 8px 25px rgba(255,255,255,0.15);transform:translateY(0);width:100%;margin-top:10px;">⬅️ BACK</button>
</div>
</div>
</section>

<script>
// ===== SUPABASE =====
const SUPABASE_URL = "https://qfkxvflyzucvkeyucbzn.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Se88Rw_onDUYfnMHxogs2g_q6WGY_3T";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

// ===== HIDE LOADING SCREEN AFTER 2 SECONDS =====
setTimeout(() => {
    document.getElementById("loadingScreen").style.display = "none";
}, 2000);

// ===== AUTH FUNCTIONS =====
function showSignup(){
    document.getElementById("loginForm").style.display = "none";
    document.getElementById("signupForm").style.display = "block";
    document.getElementById("authMessage").textContent = "";
}

function showLogin(){
    document.getElementById("signupForm").style.display = "none";
    document.getElementById("loginForm").style.display = "block";
    document.getElementById("authMessage").textContent = "";
}

async function signup(){
    const name = document.getElementById("signupName").value.trim();
    const email = document.getElementById("signupEmail").value.trim();
    const password = document.getElementById("signupPassword").value;
    if(!name || !email || !password){
        document.getElementById("authMessage").textContent = "Please fill in all fields.";
        return;
    }
    if(password.length < 6){
        document.getElementById("authMessage").textContent = "Password must be at least 6 characters.";
        return;
    }
    document.getElementById("authMessage").textContent = "Creating account...";
    const { data, error } = await client.auth.signUp({
        email, password,
        options: { data: { full_name: name } }
    });
    if(error){
        document.getElementById("authMessage").textContent = error.message;
        return;
    }
    if(!data.session){
        document.getElementById("authMessage").textContent = "✅ Account created! Check your email to confirm.";
        return;
    }
    await client.from("profiles").insert({
        id: data.user.id, full_name: name, role: 'student'
    });
    document.getElementById("authMessage").textContent = "✅ Account created! Please login.";
}

async function login(){
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    if(!email || !password){
        document.getElementById("authMessage").textContent = "Please enter your email and password.";
        return;
    }
    document.getElementById("authMessage").textContent = "Logging in...";
    const { error } = await client.auth.signInWithPassword({ email, password });
    if(error){
        document.getElementById("authMessage").textContent = error.message;
        return;
    }
    document.getElementById("authMessage").textContent = "✅ Logged in!";
    alert("Login successful! Full app coming soon...");
}

// Show login page initially
document.getElementById("authPage").style.display = "flex";
</script>

</body>
</html>
